name: CI
on:
  push:
    branches: [v13.2-final, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check frontend scripts
        run: for f in frontend/*.js backend-server.mjs; do node --check "$f" || exit 1; done
      - name: Tests (smoke, content, providers, UI, clinical accuracy set)
        run: npm test
