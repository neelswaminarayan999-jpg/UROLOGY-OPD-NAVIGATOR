name: Keep app awake
# Pings the live app every 10 minutes from 06:30 to 00:30 IST so users don't wait for the free Render server to wake up.
# Uses about 540 of Render's ~750 free instance hours a month. Lives on main (scheduled workflows only run from the default branch).
on:
  schedule:
    - cron: '*/10 1-18 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://urology-opd-navigator.onrender.com/health > /dev/null || true
