services:
  - type: web
    name: urology-oracle-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: RATE_LIMIT_PER_10MIN
        value: "30"
