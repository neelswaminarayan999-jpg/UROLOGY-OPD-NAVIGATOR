services:
  - type: web
    name: urology-oracle-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend-server.mjs
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WEB_ROOT
        value: ./frontend
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-2.5-flash
