services:
  - type: web
    name: urology-oracle-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: URO_AI_MODEL
        value: gpt-5.6-sol
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: RATE_LIMIT_PER_10MIN
        value: "30"
