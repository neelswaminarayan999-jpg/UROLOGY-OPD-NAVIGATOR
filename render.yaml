services:
  - type: web
    name: urology-oracle-ai
    env: node
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.8-flash
      - key: ALLOWED_ORIGIN
        value: '*'
